server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: clinique-gmao
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lamg_gmao_clinique}
    username: ${SPRING_DATASOURCE_USERNAME:lamg_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
gmao:
  jwt-secret: ${JWT_SECRET}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:3000}
  turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  secure-cookie: ${SECURE_COOKIE:true}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  mail-enabled: ${MAIL_ENABLED:false}
gemini:
  api-key: ${GEMINI_API_KEY:}
springdoc:
  api-docs:
    path: /api-docs

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
    org.hibernate.SQL: WARN
