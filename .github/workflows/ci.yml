name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gmao_test
          POSTGRES_USER: gmao_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gmao_test" --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
        env:
          GMAO_TEST_URL: jdbc:postgresql://localhost:5432/gmao_test
          GMAO_TEST_USER: gmao_test
          GMAO_TEST_PASSWORD: ci-test-only-password
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
